name: Build AlignBeat distributions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build and check release distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions for review
        uses: actions/upload-artifact@v4
        with:
          name: alignbeat-release-dists
          path: dist/
